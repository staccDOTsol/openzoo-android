<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>CordovaSeeker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a18; overflow: hidden; }
    body {
      display: flex; flex-direction: column; align-items: center;
      font-family: monospace; color: #e0e8ff;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #wallet-bar {
      width: 100%; max-width: 360px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: rgba(140,168,255,0.7);
      min-height: 18px; letter-spacing: 1px;
    }
    #wallet-bar .exit { color: rgba(255,120,120,0.7); cursor: pointer; padding: 4px; }

    #score {
      font-size: 44px; font-weight: bold; margin-top: 24px;
      text-shadow: 0 0 30px rgba(100,140,255,0.4);
    }
    #rate { font-size: 12px; color: rgba(140,168,255,0.6); margin-top: 4px; }

    #orb {
      width: min(58vw, 240px); height: min(58vw, 240px);
      border-radius: 50%; margin: 36px 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px; cursor: pointer;
      background: radial-gradient(circle at 35% 30%, rgba(120,160,255,0.35), rgba(40,60,140,0.15) 70%);
      border: 2px solid rgba(100,140,255,0.4);
      box-shadow: 0 0 60px rgba(60,120,255,0.3), inset 0 0 40px rgba(100,140,255,0.15);
      transition: transform 0.08s;
    }
    #orb:active { transform: scale(0.94); }

    .float {
      position: fixed; pointer-events: none;
      font-size: 22px; font-weight: bold; color: #8aa8ff;
      animation: floatUp 0.8s ease-out forwards;
      z-index: 10;
    }
    @keyframes floatUp {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-70px); }
    }

    #shop {
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .upgrade {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-radius: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      cursor: pointer; transition: background 0.15s;
    }
    .upgrade:active { background: rgba(100,140,255,0.12); }
    .upgrade.locked { opacity: 0.35; pointer-events: none; }
    .upgrade .name { font-size: 13px; letter-spacing: 1px; }
    .upgrade .desc { font-size: 10px; color: rgba(140,168,255,0.6); margin-top: 3px; }
    .upgrade .cost { font-size: 13px; color: #ffd76a; white-space: nowrap; margin-left: 12px; }
  </style>
</head>
<body data-component="clicker-game">
  <div id="wallet-bar" data-component="wallet-bar">
    <span id="wallet-label" data-component="wallet-label">GUEST</span>
    <span class="exit" onclick="exitGame()" data-testid="exit-button">✕ EXIT</span>
  </div>

  <div id="score" data-component="score">0</div>
  <div id="rate" data-component="rate">0 / sec</div>

  <div id="orb" data-testid="click-orb">⚡</div>

  <div id="shop" data-component="upgrade-shop"></div>

  <script>
  'use strict';

  /* ── State ── */
  var save = { energy: 0, perClick: 1, perSec: 0, owned: {} };
  try {
    var raw = localStorage.getItem('clicker_save');
    if (raw) save = JSON.parse(raw);
  } catch (_) {}

  var UPGRADES = [
    { id: 'finger',  name: 'CYBER FINGER',  desc: '+1 per tap',   base: 15,   click: 1, sec: 0 },
    { id: 'drone',   name: 'TAP DRONE',     desc: '+1 / sec',     base: 60,   click: 0, sec: 1 },
    { id: 'rig',     name: 'CLICK RIG',     desc: '+5 per tap',   base: 400,  click: 5, sec: 0 },
    { id: 'reactor', name: 'ORB REACTOR',   desc: '+10 / sec',    base: 1500, click: 0, sec: 10 }
  ];

  function cost(u) {
    var n = save.owned[u.id] || 0;
    return Math.floor(u.base * Math.pow(1.6, n));
  }

  /* ── UI ── */
  var $score = document.getElementById('score');
  var $rate  = document.getElementById('rate');
  var $shop  = document.getElementById('shop');

  function fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return Math.floor(n).toString();
  }

  function render() {
    $score.textContent = fmt(save.energy);
    $rate.textContent = save.perSec + ' / sec · ' + save.perClick + ' per tap';
    UPGRADES.forEach(function(u) {
      var el = document.getElementById('up-' + u.id);
      var c = cost(u);
      el.classList.toggle('locked', save.energy < c);
      el.querySelector('.cost').textContent = '⚡' + fmt(c);
      el.querySelector('.name').textContent = u.name + (save.owned[u.id] ? ' ×' + save.owned[u.id] : '');
    });
  }

  function persist() {
    try { localStorage.setItem('clicker_save', JSON.stringify(save)); } catch (_) {}
  }

  /* ── Shop ── */
  UPGRADES.forEach(function(u) {
    var el = document.createElement('div');
    el.className = 'upgrade';
    el.id = 'up-' + u.id;
    el.setAttribute('data-testid', 'upgrade-' + u.id);
    el.innerHTML =
      '<div data-component="upgrade-info"><div class="name" data-component="upgrade-name"></div>' +
      '<div class="desc" data-component="upgrade-desc">' + u.desc + '</div></div>' +
      '<div class="cost" data-component="upgrade-cost"></div>';
    el.addEventListener('click', function() {
      var c = cost(u);
      if (save.energy < c) return;
      save.energy -= c;
      save.owned[u.id] = (save.owned[u.id] || 0) + 1;
      save.perClick += u.click;
      save.perSec += u.sec;
      persist();
      render();
    });
    $shop.appendChild(el);
  });

  /* ── Tap ── */
  document.getElementById('orb').addEventListener('pointerdown', function(e) {
    save.energy += save.perClick;
    render();

    var f = document.createElement('div');
    f.className = 'float';
    f.setAttribute('data-component', 'float-text');
    f.textContent = '+' + save.perClick;
    f.style.left = (e.clientX - 10) + 'px';
    f.style.top = (e.clientY - 30) + 'px';
    document.body.appendChild(f);
    setTimeout(function() { f.remove(); }, 800);
  });

  /* ── Passive income + autosave ── */
  setInterval(function() {
    if (save.perSec > 0) { save.energy += save.perSec; render(); }
  }, 1000);
  setInterval(persist, 5000);

  /* ── Wallet bridge (messages from the shell) ── */
  var $walletLabel = document.getElementById('wallet-label');

  window.addEventListener('message', function(event) {
    if (event.source !== window.parent) return;
    var data = event.data;
    if (!data || !data.type) return;
    if (data.type === 'wallet-connected') {
      $walletLabel.textContent = data.address.slice(0, 4) + '...' + data.address.slice(-4) + ' · ' + data.method;
    }
    if (data.type === 'wallet-disconnected') {
      $walletLabel.textContent = 'GUEST';
    }
  });

  // Ask the shell for wallet info in case we loaded after connect
  window.parent.postMessage({ type: 'wallet-request-info' }, '*');

  function exitGame() {
    persist();
    window.parent.postMessage({ type: 'wallet-disconnect' }, '*');
  }

  render();
  </script>
</body>
</html>
