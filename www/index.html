<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://x402-tokens.fly.dev https://x402.accrue.fund https://api.mainnet-beta.solana.com https://solana-rpc.publicnode.com https: wss: ws:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self'; media-src 'self';">
  <title>OpenZoo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a18; }
    body {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, sans-serif; color: #fff;
      padding: 40px 20px 60px;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-y: auto;
    }

    .logo {
      width: 120px; height: 120px; border-radius: 28px;
      margin-bottom: 16px; overflow: hidden;
      background: #123;
      border: 1px solid rgba(100,140,255,0.2);
      box-shadow: 0 0 40px rgba(60,120,255,0.25);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .title {
      font-size: 28px; font-weight: 700; letter-spacing: 4px;
      color: #e0e8ff;
    }
    .sub {
      margin-top: 8px; font-size: 13px; color: rgba(255,255,255,0.45);
      text-align: center; max-width: 300px; line-height: 1.45;
    }
    .divider {
      width: 60px; height: 1px; margin: 16px 0 20px;
      background: linear-gradient(90deg, transparent, rgba(100,140,255,0.4), transparent);
    }

    #picker {
      display: flex; flex-direction: column; gap: 14px;
      width: 100%; max-width: 300px;
    }
    .btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: #fff; padding: 16px 20px;
      font-family: inherit; font-size: 14px;
      letter-spacing: 1px; border-radius: 10px;
      cursor: pointer; text-align: center;
    }
    .btn:active { background: rgba(255,255,255,0.08); transform: scale(0.97); }
    .btn:disabled { opacity: 0.3; pointer-events: none; }
    .btn.primary {
      border-color: rgba(100,140,255,0.35);
      background: linear-gradient(180deg, rgba(60,90,200,0.10) 0%, rgba(40,60,140,0.05) 100%);
    }

    #status {
      margin-top: 16px; font-size: 12px;
      color: rgba(255,255,255,0.35); text-align: center;
      max-width: 300px; word-break: break-all; min-height: 18px;
    }
    .powered {
      position: fixed; bottom: 0; left: 0; right: 0;
      text-align: center; padding: 14px;
      font-size: 10px; letter-spacing: 1px;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <div class="logo" data-component="logo">
    <img src="img/token.jpg" alt="OpenZoo">
  </div>
  <div class="title" data-component="title">OPENZOO</div>
  <p class="sub">Chat + bind + stats. You pay each call from your Phantom wallet via Mobile Wallet Adapter.</p>
  <div class="divider"></div>

  <div id="picker" data-component="wallet-picker">
    <button class="btn primary" onclick="connectMWA()" data-testid="connect-wallet">
      CONNECT PHANTOM
    </button>
  </div>

  <div id="status" data-component="status"></div>
  <div class="powered">fun.openzoo.android · Play Store / Phantom MWA</div>

  <script src="cordova.js"></script>
  <script>
  'use strict';

  var connectedAddress = null;
  var connectedMethod  = null;
  var GAME_URL    = 'app/index.html';
  var GAME_ORIGIN = '*';

  var $picker    = document.getElementById('picker');
  var $status    = document.getElementById('status');

  function log(msg) {
    console.log('[wallet-shell] ' + msg);
  }

  function setStatus(msg) { $status.textContent = msg; }

  function isAllowedExternal(url) {
    try {
      var u = new URL(url);
      return u.protocol === 'https:' &&
        u.hostname === 'x402.accrue.fund' &&
        (u.pathname === '/start' || u.pathname === '/start/');
    } catch (e) {
      return false;
    }
  }

  function openExternal(url) {
    if (!isAllowedExternal(url)) {
      log('Blocked external url: ' + url);
      return;
    }
    if (window.navigator && navigator.app && typeof navigator.app.loadUrl === 'function') {
      navigator.app.loadUrl(url, { openExternal: true });
      return;
    }
    var a = document.createElement('a');
    a.href = url;
    a.target = '_system';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function launchApp() {
    $picker.style.display = 'none';

    var old = document.getElementById('game');
    if (old) old.remove();

    var iframe = document.createElement('iframe');
    iframe.id = 'game';
    iframe.allow = 'fullscreen';
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;z-index:9999;';
    document.body.appendChild(iframe);

    if (connectedAddress) {
      var sendWalletInfo = function() {
        iframe.contentWindow.postMessage({
          type: 'wallet-connected',
          address: connectedAddress,
          method: connectedMethod
        }, GAME_ORIGIN);
        log('Sent wallet-connected to iframe');
      };

      iframe.addEventListener('load', function onLoad() {
        iframe.removeEventListener('load', onLoad);
        setTimeout(sendWalletInfo, 400);
      });
    }

    iframe.src = GAME_URL;
    log('Loading OpenZoo iframe...');
  }

  function disconnect() {
    var iframe = document.getElementById('game');
    if (iframe && connectedAddress) {
      try {
        iframe.contentWindow.postMessage({ type: 'wallet-disconnected' }, GAME_ORIGIN);
      } catch (_) {}
    }
    if (iframe) iframe.remove();

    $picker.style.display = 'flex';
    connectedAddress = null;
    connectedMethod  = null;
    setStatus('');
    log('Disconnected');
  }

  function connectMWA() {
    if (!window.MWA) {
      log('MWA plugin not loaded');
      setStatus('Wallet unavailable — needs a real phone with Phantom');
      return;
    }
    setStatus('Opening Phantom…');
    log('MWA: calling native authorize...');

    MWA.authorize(
      function(result) {
        log('Authorized: ' + result.address.slice(0, 8) + '...');
        connectedAddress = result.address;
        connectedMethod  = 'MWA';
        setStatus('');
        launchApp();
      },
      function(err) {
        log('Connect failed: ' + err);
        setStatus(err.replace(/^MWA[: ]+/i, ''));
      }
    );
  }

  window.addEventListener('message', function(event) {
    var gameFrame = document.getElementById('game');
    if (!gameFrame || event.source !== gameFrame.contentWindow) return;
    var data = event.data;
    if (!data || !data.type) return;

    if (data.type === 'wallet-disconnect') {
      log('App requested disconnect');
      disconnect();
    }

    if (data.type === 'open-external-url') {
      openExternal(data.url);
    }

    if (data.type === 'wallet-request-info' && connectedAddress) {
      gameFrame.contentWindow.postMessage({
        type: 'wallet-connected',
        address: connectedAddress,
        method: connectedMethod
      }, GAME_ORIGIN);
      log('Re-sent wallet info to iframe');
    }

    if (data.type === 'wallet-sign-message') {
      log('Sign request (message) — id:' + data.id);
      var respondMsg = function(payload) {
        payload.type = 'wallet-sign-response';
        payload.id = data.id;
        gameFrame.contentWindow.postMessage(payload, GAME_ORIGIN);
      };
      if (connectedMethod === 'MWA' && window.MWA) {
        var messageB64 = btoa(String.fromCharCode.apply(null, new TextEncoder().encode(data.message)));
        MWA.signMessage(messageB64,
          function(result) { log('Signed message (MWA)'); respondMsg({ signature: result.signature }); },
          function(err)    { log('Sign failed: ' + err); respondMsg({ error: err }); }
        );
      } else {
        respondMsg({ error: 'No wallet connected' });
      }
    }

    // Payment signer. MUST be signTransaction, never signAndSendTransaction:
    // x402 needs a partial-signed tx so the gateway feePayer can complete it.
    if (data.type === 'wallet-sign-transaction') {
      log('Sign request (transaction) — id:' + data.id);
      var respondTx = function(payload) {
        payload.type = 'wallet-sign-transaction-response';
        payload.id = data.id;
        gameFrame.contentWindow.postMessage(payload, GAME_ORIGIN);
      };
      if (connectedMethod === 'MWA' && window.MWA) {
        MWA.signTransaction(data.transaction,
          function(result) {
            log('Signed transaction (MWA)');
            respondTx({ signedTransaction: result.signedTransaction });
          },
          function(err) {
            log('Sign tx failed: ' + err);
            respondTx({ error: err });
          }
        );
      } else {
        respondTx({ error: 'No wallet connected' });
      }
    }
  });

  log('OpenZoo shell loaded');

  document.addEventListener('deviceready', function() {
    log('deviceready');
  }, false);
  </script>
</body>
</html>
