<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://zoo.openzoo.fun https://x402-tokens.fly.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; media-src 'self';">
  <title>OpenZoo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; height: 100dvh; background: #000; }
    body {
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; min-height: 100dvh; color: #ececec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 28px 16px 72px;
      padding-top: max(28px, env(safe-area-inset-top));
      overflow-y: auto; overscroll-behavior: none;
    }
    html.agent-open, body.agent-open {
      overflow: hidden !important; overscroll-behavior: none; touch-action: none;
    }
    #agentFrame {
      display: none; position: fixed; inset: 0;
      width: 100%; height: 100%; height: 100dvh; height: 100svh;
      border: 0; background: #000; z-index: 20000;
      padding: 0; margin: 0; overflow: hidden;
    }
    #agentFrame.show { display: block; }
    #agentExit {
      display: none; position: fixed;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      z-index: 20001; background: #fff; color: #000; border: 0;
      border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 700;
    }
    body.agent-open #agentExit:not([hidden]) { display: inline-flex; }
    .logo { width: 72px; height: 72px; border-radius: 18px; overflow: hidden; margin-bottom: 12px; background: #123; }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #b8f240; margin-bottom: 8px; }
    .title { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
    .sub { margin-top: 8px; font-size: 14px; color: #8e8e93; text-align: center; max-width: 340px; line-height: 1.45; }
    #tiers { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    .tier {
      text-align: left; background: #111113; border: 1px solid #2c2c2e; border-radius: 16px;
      padding: 16px; color: inherit; font: inherit; cursor: pointer;
    }
    .tier.pro { border-color: #b8f240; background: rgba(184,242,64,.06); }
    .tier:disabled { opacity: .45; pointer-events: none; }
    .thigh { font-size: 11px; color: #b8f240; letter-spacing: .04em; text-transform: uppercase; min-height: 16px; }
    .tname { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .tprice { font-size: 15px; color: #ececec; margin-top: 2px; }
    .tblurb { font-size: 13px; color: #8e8e93; margin-top: 6px; }
    .tmeta { font-size: 12px; color: #8e8e93; margin-top: 8px; line-height: 1.45; }
    #restore {
      margin-top: 16px; background: none; border: 1px solid #2c2c2e; color: #ececec;
      border-radius: 12px; padding: 10px 16px; font: inherit;
    }
    #status { margin-top: 14px; font-size: 12px; color: #8e8e93; text-align: center; max-width: 360px; min-height: 18px; }
    .powered { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 14px;
               font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,0.35); }
    #oz-boot {
      position: fixed; inset: 0; z-index: 10000;
      background: #0a0a18;
      display: flex; align-items: center; justify-content: center;
      color: #8e8e93; font-size: 14px; letter-spacing: .04em;
      text-transform: lowercase; pointer-events: auto;
    }
    #oz-boot[hidden] { display: none !important; }
    #oz-boot .oz-dot {
      display: inline-block; animation: oz-boot-dot 1.2s infinite ease-in-out; opacity: .2;
    }
    #oz-boot .oz-dot:nth-of-type(2) { animation-delay: .2s; }
    #oz-boot .oz-dot:nth-of-type(3) { animation-delay: .4s; }
    @keyframes oz-boot-dot { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  </style>
</head>
<body>
  <iframe id="agentFrame" title="Agent" hidden allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  <button type="button" id="agentExit" hidden>Chat</button>
  <div id="oz-boot" aria-live="polite">starting<span class="oz-dot">.</span><span class="oz-dot">.</span><span class="oz-dot">.</span></div>
  <div class="logo"><img src="img/token.jpg" alt="OpenZoo"></div>
  <div class="tag" id="tagline">Subscription keys · no x402</div>
  <div class="title">openzoo</div>
  <p class="sub">Pick a plan. Google Play Billing checkout — not Stripe, not a wallet. Usage invoices at $1.00.</p>

  <div id="tiers" data-component="play-paywall">
    <button type="button" class="tier" data-tier="basic" data-product="fun.openzoo.android.sub.basic">
      <div class="thigh">&nbsp;</div>
      <div class="tname">Basic</div>
      <div class="tprice">$9/mo</div>
      <div class="tblurb">One vault, one machine.</div>
      <div class="tmeta">40% savings share · 60 rpm · bind 32MB · top-k 32</div>
    </button>
    <button type="button" class="tier pro" data-tier="pro" data-product="fun.openzoo.android.sub.pro">
      <div class="thigh">Most teams want this</div>
      <div class="tname">Pro</div>
      <div class="tprice">$29/mo</div>
      <div class="tblurb">A whole archive, and the breadth to actually read it.</div>
      <div class="tmeta">20% savings share · 300 rpm · bind 512MB · top-k 128</div>
    </button>
    <button type="button" class="tier" data-tier="ultra" data-product="fun.openzoo.android.sub.ultra">
      <div class="thigh">&nbsp;</div>
      <div class="tname">Ultra</div>
      <div class="tprice">$99/mo</div>
      <div class="tblurb">Agents, fleets, and corpora that do not fit anywhere else.</div>
      <div class="tmeta">10% savings share · 2000 rpm · bind ~8GB · top-k 256</div>
    </button>
  </div>
  <button id="restore" type="button">Restore purchases</button>
  <div id="status"></div>
  <div class="powered">fun.openzoo.android · Google Play Billing</div>

  <script src="cordova.js"></script>
  <script src="js/billing.js"></script>
  <script src="js/agent-host.js"></script>
  <script>
  'use strict';

  var B = window.OpenZooBilling;
  var GAME_URL = 'app/index.html';
  var GAME_ORIGIN = '*';
  var billingState = B.readStore();
  var busy = false;

  var $tiers = document.getElementById('tiers');
  var $status = document.getElementById('status');
  var $restore = document.getElementById('restore');
  var $tag = document.getElementById('tagline');
  var bootHideTimer = null;
  var bootDismissed = false;

  function log(msg) { console.log('[play-shell] ' + msg); }
  function setStatus(msg) { $status.textContent = msg || ''; }

  function showBoot() {
    var el = document.getElementById('oz-boot');
    if (!el) return;
    bootDismissed = false;
    el.removeAttribute('hidden');
  }

  function hideBoot() {
    var el = document.getElementById('oz-boot');
    if (el) el.setAttribute('hidden', '');
  }

  function dismissBoot() {
    if (bootDismissed) return;
    bootDismissed = true;
    if (bootHideTimer) {
      clearTimeout(bootHideTimer);
      bootHideTimer = null;
    }
    hideBoot();
  }

  function launchApp() {
    showBoot();
    if (bootHideTimer) clearTimeout(bootHideTimer);
    bootHideTimer = setTimeout(dismissBoot, 4000);

    var old = document.getElementById('game');
    if (old) old.remove();
    document.querySelector('.logo').style.display = 'none';
    document.querySelector('.title').style.display = 'none';
    document.querySelector('.sub').style.display = 'none';
    $tag.style.display = 'none';
    $tiers.style.display = 'none';
    $restore.style.display = 'none';
    $status.style.display = 'none';
    document.querySelector('.powered').style.display = 'none';
    var $dev = document.getElementById('devGate');
    if ($dev) $dev.style.display = 'none';

    var iframe = document.createElement('iframe');
    iframe.id = 'game';
    iframe.allow = 'fullscreen';
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;border:none;z-index:9999;';
    document.body.appendChild(iframe);

    function sendReady() {
      iframe.contentWindow.postMessage({
        type: 'billing-ready',
        key: billingState.key || null,
        tier: billingState.tier || null,
        pending: !billingState.key,
        purchase: billingState.purchase || null,
      }, GAME_ORIGIN);
    }
    iframe.addEventListener('load', function onLoad() {
      iframe.removeEventListener('load', onLoad);
      setTimeout(sendReady, 300);
      setTimeout(dismissBoot, 50);
    });
    iframe.src = GAME_URL;
    log('Loading grokui iframe after Play entitlement');
  }

  function showPaywall() {
    hideBoot();
    document.querySelector('.logo').style.display = '';
    document.querySelector('.title').style.display = '';
    document.querySelector('.sub').style.display = '';
    $tag.style.display = '';
    $tiers.style.display = 'flex';
    $restore.style.display = '';
    $status.style.display = '';
    document.querySelector('.powered').style.display = '';
    var $dev = document.getElementById('devGate');
    if ($dev) $dev.style.display = '';
    var iframe = document.getElementById('game');
    if (iframe) iframe.remove();
  }

  function persistBilling(next) {
    billingState = B.writeStore(next);
    return billingState;
  }

  function applyExchange(ex, purchase) {
    var next = {
      key: ex.key || null,
      tier: purchase.tier || B.tierFromProductId(purchase.productId),
      purchase: {
        productId: purchase.productId,
        purchaseToken: purchase.purchaseToken,
        orderId: purchase.orderId || '',
        tier: purchase.tier || B.tierFromProductId(purchase.productId),
      },
      stub: !!ex.stub,
      todo: ex.todo || null,
      updatedAt: Date.now(),
    };
    persistBilling(next);
    if (ex.stub) {
      log('TODO play exchange: ' + ex.todo);
      setStatus('Purchase saved. Waiting on Play key exchange at /api/billing/play.');
    }
    launchApp();
  }

  function exchangeAndEnter(purchase) {
    return B.exchangePlayPurchase(purchase).then(function (ex) {
      applyExchange(ex, purchase);
    });
  }

  function playPurchase(productId) {
    return new Promise(function (resolve, reject) {
      if (!window.PlayBilling) {
        reject(new Error('Google Play Billing needs a Play Store install'));
        return;
      }
      window.PlayBilling.purchase(productId, resolve, function (err) { reject(new Error(err)); });
    });
  }

  function playRestore() {
    return new Promise(function (resolve, reject) {
      if (!window.PlayBilling) {
        reject(new Error('Google Play Billing needs a Play Store install'));
        return;
      }
      window.PlayBilling.restore(resolve, function (err) { reject(new Error(err)); });
    });
  }

  function playAcknowledge(token) {
    return new Promise(function (resolve, reject) {
      if (!window.PlayBilling || !token) { resolve(); return; }
      window.PlayBilling.acknowledge(token, resolve, function () { resolve(); });
    });
  }

  function normalizePurchase(raw, fallbackProductId) {
    if (!raw) return null;
    var productId = raw.productId || fallbackProductId || (raw.productIds && raw.productIds[0]);
    if (!raw.purchaseToken || !productId) return null;
    return {
      productId: productId,
      purchaseToken: raw.purchaseToken,
      orderId: raw.orderId || '',
      tier: B.tierFromProductId(productId),
    };
  }

  function subscribe(tierId) {
    if (busy) return;
    var productId = B.productIdFor(tierId);
    if (!productId) return;
    busy = true;
    setBusy(true);
    setStatus('Opening Google Play…');
    playPurchase(productId).then(function (raw) {
      var purchase = normalizePurchase(raw, productId);
      if (!purchase) throw new Error('Play did not return a purchase token');
      return playAcknowledge(purchase.purchaseToken).then(function () {
        return exchangeAndEnter(purchase);
      });
    }).catch(function (e) {
      var msg = (e && e.message) || String(e);
      if (/cancel/i.test(msg)) setStatus('Purchase canceled');
      else setStatus(msg);
    }).then(function () {
      busy = false;
      setBusy(false);
    });
  }

  function restore() {
    if (busy) return;
    busy = true;
    setBusy(true);
    setStatus('Restoring…');
    playRestore().then(function (list) {
      var rows = Array.isArray(list) ? list : [];
      var first = null;
      for (var i = 0; i < rows.length; i++) {
        var p = normalizePurchase(rows[i]);
        if (p) { first = p; break; }
      }
      if (!first) throw new Error('No Play subscription to restore');
      return playAcknowledge(first.purchaseToken).then(function () {
        return exchangeAndEnter(first);
      });
    }).catch(function (e) {
      setStatus((e && e.message) || String(e));
    }).then(function () {
      busy = false;
      setBusy(false);
    });
  }

  function setBusy(on) {
    var buttons = $tiers.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = !!on;
    $restore.disabled = !!on;
  }

  function renderTiers(model) {
    $tag.textContent = model.tagline || B.TAGLINE;
    $tiers.innerHTML = '';
    model.tiers.forEach(function (t) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tier' + (t.id === 'pro' ? ' pro' : '');
      btn.setAttribute('data-tier', t.id);
      btn.setAttribute('data-product', t.productId);
      btn.innerHTML =
        '<div class="thigh"></div>' +
        '<div class="tname"></div>' +
        '<div class="tprice"></div>' +
        '<div class="tblurb"></div>' +
        '<div class="tmeta"></div>';
      btn.querySelector('.thigh').textContent = t.highlight || '\u00a0';
      btn.querySelector('.tname').textContent = t.name;
      btn.querySelector('.tprice').textContent = t.priceLabel;
      btn.querySelector('.tblurb').textContent = t.blurb;
      btn.querySelector('.tmeta').textContent =
        t.savingsSharePct + '% savings share · ' + t.rpm + ' rpm · bind ' + t.bindLabel + ' · top-k ' + t.maxTopK;
      $tiers.appendChild(btn);
    });
  }

  $tiers.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-tier]');
    if (btn) subscribe(btn.getAttribute('data-tier'));
  });
  $restore.onclick = restore;

  window.addEventListener('message', function (event) {
    var gameFrame = document.getElementById('game');
    if (!gameFrame || event.source !== gameFrame.contentWindow) return;
    var data = event.data;
    if (!data || !data.type) return;

    if (data.type === 'openzoo-chrome-ready') {
      dismissBoot();
      return;
    }

    if (data.type === 'billing-sign-out') {
      persistBilling({});
      if (window.OpenZooAgentHost) window.OpenZooAgentHost.close();
      showPaywall();
      return;
    }

    if (data.type === 'openzoo-agent-open' && data.url && window.OpenZooAgentHost) {
      window.OpenZooAgentHost.open(data.url, {
        onExit: function () {
          notifyApp('openzoo-agent-closed');
        },
      });
      return;
    }

    if (data.type === 'openzoo-agent-close' && window.OpenZooAgentHost) {
      window.OpenZooAgentHost.close();
      return;
    }
  });

  var $agentExit = document.getElementById('agentExit');
  if ($agentExit) {
    $agentExit.onclick = function () {
      if (window.OpenZooAgentHost) window.OpenZooAgentHost.close();
      notifyApp('openzoo-agent-closed');
    };
  }

  function playUnlockStatus() {
    return new Promise(function (resolve) {
      if (!window.PlayBilling || typeof window.PlayBilling.unlockStatus !== 'function') {
        resolve({ debug: false, unlocked: false });
        return;
      }
      window.PlayBilling.unlockStatus(function (st) {
        resolve(st || { debug: false, unlocked: false });
      }, function () {
        resolve({ debug: false, unlocked: false });
      });
    });
  }

  function playTryUnlock(email) {
    return new Promise(function (resolve, reject) {
      if (!window.PlayBilling || typeof window.PlayBilling.tryDevUnlock !== 'function') {
        reject(new Error('unavailable'));
        return;
      }
      window.PlayBilling.tryDevUnlock(email, resolve, function (err) { reject(new Error(err)); });
    });
  }

  function mountDevField() {
    if (document.getElementById('devGate')) return;
    var wrap = document.createElement('form');
    wrap.id = 'devGate';
    wrap.setAttribute('autocomplete', 'off');
    wrap.style.cssText = 'margin-top:14px;width:100%;max-width:420px;';
    var input = document.createElement('input');
    input.id = 'devField';
    input.type = 'email';
    input.autocomplete = 'off';
    input.autocapitalize = 'none';
    input.spellcheck = false;
    input.placeholder = 'dev';
    input.setAttribute('aria-label', 'dev');
    input.style.cssText = 'width:100%;background:#0a0a0b;border:1px solid #1c1c1e;color:#6f7080;border-radius:10px;padding:7px 10px;font:inherit;font-size:12px;';
    wrap.appendChild(input);
    wrap.addEventListener('submit', function (e) {
      e.preventDefault();
      playTryUnlock(String(input.value || '').trim()).then(function () {
        launchApp();
      }).catch(function () {});
    });
    $restore.parentNode.insertBefore(wrap, $restore.nextSibling);
  }

  function boot() {
    playUnlockStatus().then(function (st) {
      if (st && st.unlocked) {
        launchApp();
        return;
      }
      if (st && st.debug) mountDevField();
      return B.loadTiers().then(function (model) {
        renderTiers(model);
        if (B.hasEntitlement(billingState)) {
          launchApp();
          return;
        }
        setStatus(model.trialDays ? '' : 'No free trial. Google Play checkout.');
      });
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    // First-run: paywall is the first UI. Entitled skip-picker keeps #oz-boot up.
    if (!B.hasEntitlement(billingState)) hideBoot();
  });

  document.addEventListener('deviceready', function () {
    log('deviceready');
    boot();
  }, false);

  function notifyApp(type) {
    var iframe = document.getElementById('game');
    if (iframe && iframe.contentWindow) {
      iframe.contentWindow.postMessage({ type: type }, GAME_ORIGIN);
    }
  }
  document.addEventListener('pause', function () { notifyApp('app-pause'); }, false);
  document.addEventListener('resume', function () { notifyApp('app-resume'); }, false);

  // Browser / unit environments still render the Play paywall, never Stripe or a wallet.
  if (!window.cordova) boot();
  </script>
</body>
</html>
