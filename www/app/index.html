<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://zoo.openzoo.fun https://x402-tokens.fly.dev; img-src 'self' data:; style-src 'self' 'unsafe-inline';">
<meta name="openzoo-connect" content="https://zoo.openzoo.fun https://x402-tokens.fly.dev">
<title>openzoo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; }
  body { color: #ececec; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
         display: flex; height: 100%; overflow: hidden; }
  #sidebar {
    width: 280px; flex: 0 0 280px; border-right: 1px solid #1c1c1e; display: flex; flex-direction: column;
    height: 100%; background: #000; z-index: 40;
    padding-top: env(safe-area-inset-top);
  }
  #sideTop { display: flex; align-items: center; gap: 6px; padding: 10px 8px 0; }
  #search { flex: 1; margin: 0; padding: 8px 12px; background: #1c1c1e; border-radius: 10px; color: #ececec;
            border: none; font: inherit; }
  #search::placeholder { color: #8e8e93; }
  #threads { flex: 1; overflow-y: auto; padding: 8px 0 16px; }
  .trow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-radius: 10px;
          margin: 0 6px 2px; }
  .trow:hover { background: #17171a; }
  .trow.active { background: #1c1c1e; }
  .tavatar { width: 36px; height: 36px; border-radius: 10px; flex: 0 0 36px; display: flex; align-items: center;
             justify-content: center; color: #fff; font-weight: 600; font-size: 14px; }
  .tmeta { min-width: 0; flex: 1; }
  .tname { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tprev { font-size: 12px; color: #8e8e93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tclose { flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; border: none; background: transparent;
            color: #8e8e93; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .icon-btn { width: 32px; height: 32px; border-radius: 50%; border: none; background: transparent;
              color: #ececec; display: flex; align-items: center; justify-content: center; cursor: pointer;
              flex: 0 0 32px; }
  .icon-btn:hover { background: #3a3a3c; }
  .icon-btn svg { width: 18px; height: 18px; }
  #main { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; }
  #chatHeader { padding: 12px 14px; padding-top: max(12px, env(safe-area-inset-top));
                border-bottom: 1px solid #1c1c1e; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  #chatHeaderId { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow: hidden; }
  .hname { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #headerDials { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .dial { border: 1px solid #2c2c2e; background: #131315; color: #8e8e93; font: inherit; font-size: 11px;
          border-radius: 999px; padding: 4px 8px; cursor: pointer; max-width: 140px; }
  .dial:hover { color: #ececec; border-color: #3a3a3c; }
  .dial.hot { color: #ececec; border-color: #5e5ce6; }
  #model.hidden-dial { display: none; }
  #tierSel, #raceSel { max-width: 108px; }
  #headerNewBtn {
    flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    background: #fff; color: #000; border: 0; border-radius: 999px;
    padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 700;
    white-space: nowrap; cursor: pointer;
  }
  .new-chat-row {
    display: block; margin: 8px 8px 6px; width: calc(100% - 16px);
    background: #1c1c1e; color: #ececec; border: 1px solid #2c2c2e; border-radius: 12px;
    padding: 12px 14px; font: inherit; font-size: 15px; font-weight: 700;
    text-align: left; cursor: pointer;
  }
  .new-chat-row:hover { background: #2c2c2e; }
  #log { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 8px;
         display: flex; flex-direction: column; gap: 6px; -webkit-user-select: text; user-select: text; }
  .row { display: flex; max-width: 86%; min-width: 0; margin: 2px 0; }
  .row.user { align-self: flex-end; }
  .row.bot { align-self: flex-start; }
  .bubble { padding: 11px 16px; border-radius: 20px; white-space: pre-wrap; word-break: break-word;
            min-width: 0; max-width: 100%; }
  .row.user .bubble { background: #57575c; }
  .row.bot .bubble { background: #262626; color: #ececec; }
  .meta { font-size: 11px; color: #8e8e93; margin-top: 4px; }
  .dots span { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%;
               background: #8e8e93; animation: blink 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  #bar { padding: 10px 12px max(14px, env(safe-area-inset-bottom)); position: relative; }
  #plusMenu { position: absolute; bottom: 62px; left: 12px; background: #1c1c1e; border-radius: 14px;
              padding: 6px; display: none; flex-direction: column; min-width: 190px;
              box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 10; }
  #plusMenu.show { display: flex; }
  .pop-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
              cursor: pointer; color: #ececec; font-size: 14px; }
  .pop-item:hover { background: #2c2c2e; }
  #attachChips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 4px 6px; }
  .achip { display: flex; align-items: center; gap: 6px; background: #2c2c2e; color: #ececec; border-radius: 10px;
           padding: 4px 8px; font-size: 12px; }
  .achip .ax { cursor: pointer; color: #8e8e93; }
  #row-input { display: flex; align-items: center; gap: 8px; }
  #pill { flex: 1; display: flex; align-items: center; gap: 6px; background: #2c2c2e; border-radius: 26px;
          padding: 8px 10px 8px 8px; }
  #inp { flex: 1; background: transparent; border: none; color: #ececec; font: inherit; padding: 6px 0; min-width: 0; }
  #inp::placeholder { color: #8e8e93; }
  #inp:focus { outline: none; }
  #send { width: 34px; height: 34px; border-radius: 50%; border: none; background: #fff; color: #000;
          display: none; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 34px; }
  #send.show { display: flex; }
  #send svg { width: 16px; height: 16px; }
  #menuBtn { display: none; }
  #scrim { display: none; }
  #pasteOverlay, #settingsOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.66); z-index: 80;
    display: none; align-items: flex-end; justify-content: center;
  }
  #pasteOverlay.show, #settingsOverlay.show { display: flex; }
  .sheet { width: 100%; max-width: 560px; max-height: 82vh; overflow-y: auto; background: #111113;
           border: 1px solid #2c2c2e; border-radius: 16px 16px 0 0; padding: 20px 18px 24px; }
  .sheet h3 { margin: 0 0 6px; font-size: 15px; }
  .wsub, .tiny { color: #8e8e93; font-size: 12px; margin: 0 0 14px; }
  .wbal { border: 1px solid #1c1c1e; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .ghost { background: none; border: 1px solid #2c2c2e; border-radius: 12px; padding: 8px 12px; color: #ececec; }
  .sheet textarea { width: 100%; min-height: 120px; background: #1c1c1e; color: #ececec; border: 1px solid #2c2c2e;
                    border-radius: 12px; padding: 10px; font: inherit; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .sendish { background: #fff; color: #000; border: 0; border-radius: 12px; padding: 8px 14px; font-weight: 700; }
  #statusLine, #hud { font-size: 11px; color: #8e8e93; padding: 0 16px 4px; min-height: 16px; }
  @media (max-width: 720px) {
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-105%);
      transition: transform .18s ease; box-shadow: 8px 0 30px rgba(0,0,0,.4);
    }
    #sidebar.open { transform: none; }
    #menuBtn { display: flex; }
    #scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; }
    #headerNewBtn { display: inline-flex; }
    #model { max-width: 72px; }
    #tierSel, #raceSel { max-width: 86px; }
  }
</style>
</head>
<body>
  <div id="scrim"></div>
  <div id="sidebar">
    <div id="sideTop">
      <input id="search" placeholder="Search" autocomplete="off">
    </div>
    <button type="button" class="new-chat-row" id="sideNewBtn" data-component="new-chat">New chat</button>
    <div id="threads"></div>
  </div>

  <div id="main">
    <div id="chatHeader">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Threads">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="chatHeaderId">
        <div class="tavatar" id="headAv">OZ</div>
        <div class="hname" id="headName">openzoo</div>
      </div>
      <button type="button" id="headerNewBtn" data-component="new-chat">New chat</button>
      <div id="headerDials">
        <input class="dial" id="model" list="modelList" placeholder="Auto" autocomplete="off">
        <datalist id="modelList">
          <option value="openzoo/auto" label="Auto"></option>
        </datalist>
        <select class="dial" id="tierSel" data-component="model-tier" aria-label="Model band">
          <option value="auto" selected>Auto</option>
          <option value="cheap">cheap</option>
          <option value="medium">medium</option>
          <option value="expensive">expensive</option>
          <option value="grok4.6">grok4.6</option>
        </select>
        <select class="dial" id="raceSel" data-component="model-race" aria-label="Race models">
          <option value="0">1 model</option>
          <optgroup label="first back wins">
            <option value="2">race 2</option>
            <option value="3">race 3</option>
            <option value="4">race 4</option>
          </optgroup>
          <optgroup label="judge the first k back">
            <option value="2 3">best 2 of 3</option>
            <option value="2 4" selected>best 2 of 4</option>
            <option value="3 4">best 3 of 4</option>
            <option value="4 4">best 4 of 4</option>
          </optgroup>
        </select>
        <button class="dial" id="settingsBtn" type="button">settings</button>
      </div>
    </div>
    <div id="log"></div>
    <div id="hud"></div>
    <div id="statusLine"></div>
    <div id="bar">
      <div id="plusMenu">
        <div class="pop-item" id="attachBtn">Attach files</div>
        <div class="pop-item" id="folderBtn">Attach folder</div>
        <div class="pop-item" id="pasteBtn">Paste text</div>
      </div>
      <input id="fileInp" type="file" multiple style="position:absolute;width:1px;height:1px;opacity:0">
      <input id="folderInp" type="file" webkitdirectory multiple style="position:absolute;width:1px;height:1px;opacity:0">
      <div id="attachChips"></div>
      <div id="row-input">
        <div id="pill">
          <button class="icon-btn" id="plusBtn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <input id="inp" placeholder="Message" autocomplete="off">
        </div>
        <button id="send" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="settingsOverlay">
    <div class="sheet">
      <h3>Settings</h3>
      <p class="wsub">Google Play subscription. Basic $9 / Pro $29 / Ultra $99.</p>
      <div id="planBody" class="wbal">loading plan…</div>
      <div class="actions">
        <button class="ghost" id="changePlanBtn" type="button">Change plan</button>
        <button class="ghost" id="settingsClose" type="button">close</button>
      </div>
    </div>
  </div>

  <div id="pasteOverlay">
    <div class="sheet">
      <h3>Paste text</h3>
      <p class="tiny">Attached notes are remembered for this thread. You will not see any bind homework.</p>
      <textarea id="pasteBox" placeholder="paste anything…"></textarea>
      <div class="actions">
        <button class="sendish" id="pasteSave" type="button">attach</button>
        <button class="ghost" id="pasteClose" type="button">close</button>
      </div>
    </div>
  </div>

<script src="js/rails.js"></script>
<script src="js/bind.js"></script>
<script src="js/spill.js"></script>
<script src="js/race.js"></script>
<script src="js/pay.js"></script>
<script src="js/app.js"></script>
</body>
</html>
